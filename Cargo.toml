[workspace]
resolver = "3"
members = ["crates/app-core", "crates/hub-kit", "crates/tasks-hub", "crates/hub-testkit"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Stefan Bartl"]
repository = "https://github.com/StefanBartl/tasks-desktop"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# The program `tasks-hub install` copies: small and quick to start.
[profile.release]
lto = "thin"
strip = true

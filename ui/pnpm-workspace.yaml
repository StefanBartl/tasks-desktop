# Supply chain (concept 7.1): nothing younger than seven days, no downgrade
# of the trust level, no install scripts unless named here.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true
onlyBuiltDependencies: []
# One named exception: chokidar 4.0.3 (a dependency of svelte-check, used only
# to watch files in dev) was published without the provenance its earlier
# versions had. It is a build-time tool, never in the shipped bundle.
trustPolicyExclude:
  - chokidar@4.0.3
# One named exception to the release age: markdown-it 15.0.3 (2026-10-16) is the
# fix of GHSA-gfr2-rv44-r23c (high, quadratic time on a multi-line link
# reference) in 15.0.0 to 15.0.2, which appkit-ui renders the text of a task
# with. Waiting the seven days would keep the known flaw. It needs argparse
# 3.0.3 (2026-10-15, the same maintainers, nodeca), which markdown-it uses only
# for its command line, not in the page. Both versions are named exactly: a
# later one waits as every other package does.
minimumReleaseAgeExclude:
  - markdown-it@15.0.3
  - argparse@3.0.3

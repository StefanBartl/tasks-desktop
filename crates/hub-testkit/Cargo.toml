[package]
name = "hub-testkit"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Test support for the tasks hub: the tasks hub as a subject of the security matrix, the fake tasks engine, and the tests that need a process"

[lints]
workspace = true

[lib]
name = "hub_testkit"
path = "src/lib.rs"

[[bin]]
name = "fake-nvim"
path = "src/bin/fake-nvim.rs"

[dependencies]
appkit-core = { path = "../appkit-core" }
appkit-hub = { path = "../appkit-hub" }
appkit-testkit = { path = "../appkit-testkit" }
tasks-hub = { path = "../tasks-hub" }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }

[package]
name = "hub-testkit"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Test support for the hub: a fake Neovim, the security matrix any app's hub must pass, and the tests that need a process"

[lints]
workspace = true

[lib]
name = "hub_testkit"
path = "src/lib.rs"

[[bin]]
name = "fake-nvim"
path = "src/bin/fake-nvim.rs"

[dependencies]
app-core = { path = "../app-core" }
hub-kit = { path = "../hub-kit" }
tasks-hub = { path = "../tasks-hub" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }

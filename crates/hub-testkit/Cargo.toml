[package]
name = "hub-testkit"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Test support for the hub: a fake Neovim and the tests that need a process"

[lints]
workspace = true

[[bin]]
name = "fake-nvim"
path = "src/bin/fake-nvim.rs"

[dependencies]
tasks-hub = { path = "../tasks-hub" }
serde_json = "1"

[dev-dependencies]
app-core = { path = "../app-core" }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }

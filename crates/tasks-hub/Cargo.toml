[package]
name = "tasks-hub"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Local hub for tasks.nvim: engine trait, snapshot, queue, watch, routes"

[lints]
workspace = true

[lib]
name = "tasks_hub"
path = "src/lib.rs"

[[bin]]
name = "tasks-hub"
path = "src/main.rs"

[dependencies]
app-core = { path = "../app-core" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["server", "tokio", "service", "http1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["sync", "rt", "rt-multi-thread", "net", "time", "macros", "io-util", "signal"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros"] }

# The web variant: builds the page as one file (ui/dist-web/tasks.html), tests it, and puts it into the private
# repository WKDSteve/tasks-web, from which it is opened on a machine that may not install anything:
#
#   git clone https://github.com/WKDSteve/tasks-web   (git pull for a newer one)
#   open file:///C:/repos/tasks-web/tasks.html        (a local file: no server, no hosting)
#
# Runs on a tag (v*) and by hand. Like ci.yml it runs on the author's own Windows machine (self-hosted runner), whose git
# credentials push to tasks-web: there is no deploy key and no secret in this workflow, and a workflow that anybody else
# could trigger would have the author's rights, which is why it has no `pull_request` trigger and no `workflow_run`.
# The file is built from the tag, opened in Chrome from disk with the requests counted (ui/e2e-web), and only then
# published; SHA256SUMS in tasks-web lists every page of that repository.

name: web

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web
  cancel-in-progress: false

env:
  TASKS_DESKTOP_REQUIRE_ENGINE: "1"
  TASKS_ENGINE_DIR: ${{ github.workspace }}/engine/tasks.nvim
  LIB_NVIM_DIR: ${{ github.workspace }}/engine/lib.nvim

defaults:
  run:
    shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}

jobs:
  publish:
    runs-on: [self-hosted, windows]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      # The engine of the page is the pinned one: its sources go into the file.
      - name: Fetch the pinned engine (tasks.nvim is private) and lib.nvim
        run: |
          commit="$(sed -n 's/^commit *= *//p' engine.lock)"
          lib_commit="$(sed -n 's/^lib_commit *= *//p' engine.lock)"
          rm -rf engine
          mkdir engine
          git clone --quiet https://github.com/WKDSteve/tasks.nvim engine/tasks.nvim
          git -C engine/tasks.nvim checkout --quiet "$commit"
          git clone --quiet https://github.com/WKDSteve/lib.nvim engine/lib.nvim
          git -C engine/lib.nvim checkout --quiet "$lib_commit"
      - uses: ./.github/actions/pnpm-auth
      - name: Install
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Web tests (the engine against nvim, the page's parts)
        working-directory: ui
        env:
          TASKS_WEB_COMPARE: "1"
        run: node ../tools/run-with-temp.mjs -- pnpm web:test
      - name: Build the page
        working-directory: ui
        env:
          WEB_BUILD: ${{ github.ref_name }}
        run: pnpm web:build
      # The same project as in ci.yml (ui/e2e-web/): the built file itself, from disk, in Chrome. What is published is
      # what was tested. Both test steps run through tools/run-with-temp.mjs, as in ci.yml: a temp dir of their own, and
      # the step fails when a test left a folder of its own in it.
      - name: Open the file from disk in Chrome
        working-directory: ui
        run: node ../tools/run-with-temp.mjs -- pnpm web:e2e
      - name: Traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24)
        with:
          name: playwright-traces
          path: ui/test-results
          if-no-files-found: ignore
          retention-days: 14
      # tasks-web holds nothing but the built pages and their sums. A page that did not change is not committed again.
      - name: Publish to tasks-web
        run: |
          sha="$(git rev-parse --short HEAD)"
          publish="$RUNNER_TEMP/tasks-web"
          rm -rf "$publish"
          git clone --quiet https://github.com/WKDSteve/tasks-web "$publish"
          cp ui/dist-web/tasks.html "$publish/tasks.html"
          cd "$publish"
          sha256sum *.html > SHA256SUMS
          git add tasks.html SHA256SUMS
          if git diff --cached --quiet; then
            echo "tasks.html is the same as the published one"
          else
            git commit --quiet -m "tasks.html, built from tasks-desktop@$sha (${{ github.ref_name }})"
            git push --quiet origin HEAD
          fi

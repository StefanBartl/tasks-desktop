name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A missing engine is a failure in CI, not a skipped test.
  TASKS_DESKTOP_REQUIRE_ENGINE: "1"
  TASKS_ENGINE_DIR: ${{ github.workspace }}/engine/tasks.nvim
  LIB_NVIM_DIR: ${{ github.workspace }}/engine/lib.nvim

jobs:
  rust:
    runs-on: windows-latest
    steps:
      # Actions are pinned by commit (concept 7.4); the comment names the tag.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - name: Read the pinned engine commits
        id: engine
        shell: bash
        run: |
          echo "commit=$(sed -n 's/^commit *= *//p' engine.lock)" >> "$GITHUB_OUTPUT"
          echo "lib_commit=$(sed -n 's/^lib_commit *= *//p' engine.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          repository: StefanBartl/tasks.nvim
          ref: ${{ steps.engine.outputs.commit }}
          path: engine/tasks.nvim
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          repository: StefanBartl/lib.nvim
          ref: ${{ steps.engine.outputs.lib_commit }}
          path: engine/lib.nvim
          persist-credentials: false
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: v0.12.2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      # The types of the UI are the engine's, copied: a change of the
      # contract that did not reach the UI fails here.
      - name: UI contract types equal the engine's
        shell: bash
        run: cmp engine/tasks.nvim/schemas/tasks-export/1/tasks-export.d.ts ui/src/lib/contract.d.ts
      # The interface is part of the binary: it is built first.
      - name: Build the interface
        shell: bash
        working-directory: ui
        run: |
          npm install --global pnpm@11.28.2
          pnpm install --frozen-lockfile
          pnpm build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The install and uninstall scripts (NREL-16) against this build, in folders of their own:
      # the login entry and the link of the runner are left alone, nothing is downloaded.
      - name: Install and uninstall scripts (PowerShell and sh)
        shell: bash
        run: |
          pwsh -NoProfile -File scripts/test-install.ps1 target/debug/tasks-hub.exe
          sh scripts/test-install.sh target/debug/tasks-hub.exe
      - name: PSScriptAnalyzer on the scripts
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          $found = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error, Warning
          $found | Format-Table -AutoSize | Out-String | Write-Output
          if ($found) { exit 1 }
      # The browser tests: the binary, the real engine, the system's Chrome.
      - name: Browser tests (Playwright, axe, XSS corpus)
        shell: bash
        working-directory: ui
        run: pnpm e2e
      # A failed browser test leaves its trace (network, DOM, console) to read instead of a guess.
      - name: Traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24)
        with:
          name: playwright-traces
          path: ui/test-results
          if-no-files-found: ignore
          retention-days: 14
      # The supply chain (concept 7.4): known advisories, licenses, sources.
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny check
      # No crate version younger than a week (a hijacked release is caught
      # within hours, usually; see tools/check-lock-age.py).
      - run: python tools/check-lock-age.py --min-days 7
      # appkit is the one git source: the commit Cargo.lock pins must be the one its tag names now.
      - run: python tools/check-appkit-pin.py

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      # The lockfile is the truth; the age and trust policy are in
      # ui/pnpm-workspace.yaml.
      - run: npm install --global pnpm@11.28.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level high

  # A control or invisible character in a tracked text file (a backspace in a
  # path, a bidirectional override in source) is refused; the tool tests itself.
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - run: python3 -m unittest discover tools
      - run: python3 tools/check-control-chars.py
      # A colour the CSS of the page states is a token of appkit-ui (the same check runs in appkit).
      - run: python3 tools/check-color-literals.py
      # The shell scripts of the repository (NREL-16): ShellCheck is on the runner.
      - run: shellcheck scripts/*.sh

  # The install and uninstall scripts on Linux, against a build of the hub (NREL-16).
  scripts-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      # The interface is part of the binary: it is built first.
      - name: Build the interface
        working-directory: ui
        run: |
          npm install --global pnpm@11.28.2
          pnpm install --frozen-lockfile
          pnpm build
      - run: cargo build --locked -p tasks-hub
      - run: sh scripts/test-install.sh target/debug/tasks-hub

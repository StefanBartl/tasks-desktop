name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A missing engine is a failure in CI, not a skipped test.
  TASKS_DESKTOP_REQUIRE_ENGINE: "1"
  TASKS_ENGINE_DIR: ${{ github.workspace }}/engine/tasks.nvim
  LIB_NVIM_DIR: ${{ github.workspace }}/engine/lib.nvim

jobs:
  rust:
    runs-on: windows-latest
    steps:
      # Actions are pinned by commit (concept 7.4); the comment names the tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read the pinned engine commits
        id: engine
        shell: bash
        run: |
          echo "commit=$(sed -n 's/^commit *= *//p' engine.lock)" >> "$GITHUB_OUTPUT"
          echo "lib_commit=$(sed -n 's/^lib_commit *= *//p' engine.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: StefanBartl/tasks.nvim
          ref: ${{ steps.engine.outputs.commit }}
          path: engine/tasks.nvim
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: StefanBartl/lib.nvim
          ref: ${{ steps.engine.outputs.lib_commit }}
          path: engine/lib.nvim
          persist-credentials: false
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: v0.12.2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      # The types of the UI are the engine's, copied: a change of the
      # contract that did not reach the UI fails here.
      - name: UI contract types equal the engine's
        shell: bash
        run: cmp engine/tasks.nvim/schemas/tasks-export/1/tasks-export.d.ts ui/src/lib/contract.d.ts
      # The interface is part of the binary: it is built first.
      - name: Build the interface
        shell: bash
        working-directory: ui
        run: |
          npm install --global pnpm@10.29.2
          pnpm install --frozen-lockfile
          pnpm build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The browser tests: the binary, the real engine, the system's Chrome.
      - name: Browser tests (Playwright, axe, XSS corpus)
        shell: bash
        working-directory: ui
        run: pnpm e2e
      # The supply chain (concept 7.4): known advisories, licenses, sources.
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny check
      # No crate version younger than a week (a hijacked release is caught
      # within hours, usually; see tools/check-lock-age.py).
      - run: python tools/check-lock-age.py --min-days 7

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The lockfile is the truth; the age and trust policy are in
      # ui/pnpm-workspace.yaml.
      - run: npm install --global pnpm@10.29.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level high
